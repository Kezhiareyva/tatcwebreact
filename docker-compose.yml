version: '3.8'

services:
  # phpMyAdmin TIDAK ikut jalan secara default (opt-in lewat profile "tools").
  # Jalankan hanya saat dibutuhkan:  docker compose --profile tools up -d phpmyadmin
  # Matikan lagi setelah selesai:     docker compose stop phpmyadmin
  # Port hanya di-bind ke 127.0.0.1 -> akses dari laptop via SSH tunnel (lihat DEPLOYMENT.md):
  #   ssh -L <PMA_PORT2>:127.0.0.1:<PMA_PORT2> user@server   lalu buka http://localhost:<PMA_PORT2>
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: tatc_phpmyadmin
    restart: "no"
    profiles: ["tools"]
    environment:
      PMA_HOST: ${PMA_HOST}
      PMA_PORT: ${PMA_PORT1}
      UPLOAD_LIMIT: ${PMA_UPLOAD_LIMIT}
    ports:
      - "127.0.0.1:${PMA_PORT2:?PMA_PORT2 wajib diisi di .env}:${PMA_PORT3:?PMA_PORT3 wajib diisi di .env}"
    networks:
      - app-network
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: tatc_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
    # Sengaja TIDAK ada blok "ports": MySQL hanya bisa diakses dari container lain
    # di app-network (backend -> host "mysql"). Docker mem-bypass UFW, jadi port
    # yang di-publish akan tetap terbuka ke internet walau firewall menutupnya.
    # Untuk backup/restore gunakan:  docker exec tatc_mysql mysqldump ...
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tatc_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=mysql://${DB_USER}:${DB_PASS}@mysql:${DB_PORT}/${DB_NAME}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASS}
      - SESSION_SECRET=${SESSION_SECRET}
      - PORT=${BACKEND_PORT2:?BACKEND_PORT2 wajib diisi di .env}
      - FRONTEND_URL=${FRONTEND_URL}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
    # Di-bind ke 127.0.0.1: hanya bisa dijangkau reverse proxy (Caddy) di host yang sama,
    # tidak bisa diakses langsung dari internet (mencegah bypass HTTPS & spoof X-Forwarded-For).
    # Sengaja di-hardcode (bukan ${BACKEND_BIND_IP}) agar tidak bisa terbuka karena salah isi .env.
    ports:
      - "127.0.0.1:${BACKEND_PORT1:?BACKEND_PORT1 wajib diisi di .env}:${BACKEND_PORT2}"
    volumes:
      - tatc_uploads:/app/public/uploads
      - tatc_documents:/app/public/documents
      - tatc_payments:/app/public/payments
    depends_on:
      - mysql
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tatc_frontend
    restart: unless-stopped
    environment:
      - PORT=${FRONTEND_PORT2:?FRONTEND_PORT2 wajib diisi di .env}
    # Di-bind ke 127.0.0.1: hanya Caddy di host yang bisa menjangkau (lihat DEPLOYMENT.md).
    ports:
      - "127.0.0.1:${FRONTEND_PORT1:?FRONTEND_PORT1 wajib diisi di .env}:${FRONTEND_PORT2}"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
  tatc_uploads:
  tatc_documents:
  tatc_payments: